# JERMZONE Nginx reference config.
#
# ⚠️  DO NOT COPY THIS FILE OVER THE LIVE CONFIG.
#
# The live file (/etc/nginx/sites-enabled/jermzone) has diverged from this one:
# certbot added `listen 443 ssl` blocks and the cert directives for
# jerm.zapto.org, wakeupleague.servegame.com, wakeupleague.com and
# www.wakeupleague.com. Overwriting it with this file would remove HTTPS from
# every site.
#
# This file is the documented baseline of the :80 routing intent. To change the
# live config:
#
#   jz nginx pull            # fetch live config + timestamped backup
#   jz nginx test            # validate on the Pi (nginx -t)
#   jz nginx apply           # install + reload, only if the test passed
#
# Port map on the Pi: 3000 wulv2-frontend, 3001 wulv2-backend,
#                     3002 jermzone-landing, 3003 jermzone-games,
#                     3004 logpulse
#
# Prerequisites for the telemetry include (see logpulse/nginx/):
#   sudo cp logpulse/nginx/logpulse-http.conf      /etc/nginx/conf.d/
#   sudo cp logpulse/nginx/logpulse-telemetry.conf /etc/nginx/snippets/
#   jz nginx cf-ranges       # generates /etc/nginx/conf.d/cloudflare-real-ip.conf

# ─── jerm.zapto.org — main landing + all apps ───
server {
    listen 80;
    server_name jerm.zapto.org 192.168.1.111;

    # Landing page (root)
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Games app (Next.js basePath /games on port 3003)
    location /games {
        proxy_pass         http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WULv2 frontend (Next.js basePath /league on port 3000)
    location /league {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WULv2 backend API
    location /api {
        # Media uploads (forum images, message attachments) are capped at 8 MB
        # in the app; nginx defaults to 1 MB and would 413 them.
        client_max_body_size 10m;

        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # logpulse telemetry ingest (rate-limited; see logpulse/nginx/)
    include /etc/nginx/snippets/logpulse-telemetry.conf;
}

# ─── wakeupleague.com — league app ───
# Live config also carries wakeupleague.servegame.com and www.wakeupleague.com
# on this block, plus the certbot-managed 443 listener.
server {
    listen 80;
    server_name wakeupleague.com www.wakeupleague.com wakeupleague.servegame.com;

    # Root redirects to /league
    location = / {
        return 301 /league;
    }

    # WULv2 frontend (Next.js basePath /league on port 3000)
    location /league {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WULv2 backend API
    location /api {
        client_max_body_size 10m;

        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # logpulse telemetry ingest (rate-limited; see logpulse/nginx/)
    include /etc/nginx/snippets/logpulse-telemetry.conf;
}
